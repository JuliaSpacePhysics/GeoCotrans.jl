name: Benchmarks

on:
  pull_request_target:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'test/**'
      - 'docs/**'
  push:
    branches:
      - main

jobs:
  bench:
    uses: JuliaSpacePhysics/actions/.github/workflows/benchmark.yml@main
    permissions:
      actions: write
      contents: read
      pull-requests: write